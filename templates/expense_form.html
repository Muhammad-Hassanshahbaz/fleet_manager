{% extends 'base.html' %}
{% block content %}
<h1 class="h4 mb-3">{{ 'Edit expense' if eid else 'Add maintenance / other expense' }}</h1>
<form method="post" class="card" style="max-width:820px"><div class="card-body row g-3">
  <div class="col-md-6">
    <label class="form-label">Vehicle *</label>
    <select name="vehicle_id" class="form-select" required>
      <option value="">Choose…</option>
      {% for v in vehicles %}<option value="{{ v.id }}" {{ 'selected' if e.vehicle_id == v.id }}>{{ v.reg_no }} – {{ v.make_model }}{{ ' (inactive)' if not v.active }}</option>{% endfor %}
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label">Date *</label>
    <input type="date" name="date" class="form-control" required value="{{ e.date or '' }}" max="{{ today }}">
  </div>
  <div class="col-md-3">
    <label class="form-label">Amount ({{ CURRENCY }}) *</label>
    <input type="number" step="0.01" min="0.01" name="amount" class="form-control" required value="{{ e.amount if e.amount is not none else '' }}">
  </div>
  <div class="col-md-6">
    <label class="form-label">Category *</label>
    <select name="category" class="form-select" required>
      <option value="">Choose…</option>
      {% for c in categories %}<option {{ 'selected' if e.category == c }}>{{ c }}</option>{% endfor %}
    </select>
  </div>
  <div class="col-md-6">
    <label class="form-label">Odometer (km)</label>
    <input type="number" step="1" min="0" name="odometer" class="form-control" value="{{ e.odometer|int if e.odometer else '' }}">
  </div>
  <div class="col-12">
    <label class="form-label">Description</label>
    <input name="description" class="form-control" value="{{ e.description or '' }}">
  </div>
  <div class="col-12">
    <button class="btn btn-primary"><i class="bi bi-save"></i> Save</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('expenses') }}">Cancel</a>
  </div>
</div></form>
{% endblock %}
